# Alembic configuration for the Food Manufacturing Management System.
#
# Database connection settings are loaded from Pydantic Settings
# in backend/alembic/env.py.
#
# Do not store Supabase credentials in this file.

[alembic]

# Directory containing the Alembic migration environment.
script_location = %(here)s/alembic

# Add the backend directory to Python's import path.
prepend_sys_path = %(here)s

# Use the operating system's path separator.
path_separator = os

# Migration revision filenames.
file_template = %%(rev)s_%%(slug)s

# Timezone for generated migration timestamps.
timezone = UTC

# Maximum length of revision filename slugs.
truncate_slug_length = 40

# Detect migration files from the versions directory.
recursive_version_locations = false

# Use UTF-8 for generated migration files.
output_encoding = utf-8

# The database URL is supplied dynamically by env.py.
# No sqlalchemy.url value is required here.


[post_write_hooks]

# No automatic migration-file formatting hooks are configured.


[loggers]
keys = root,sqlalchemy,alembic


[handlers]
keys = console


[formatters]
keys = generic


[logger_root]
level = WARNING
handlers = console


[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine


[logger_alembic]
level = INFO
handlers =
qualname = alembic


[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic


[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %Y-%m-%d %H:%M:%S